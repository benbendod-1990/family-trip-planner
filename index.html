<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF3DF" />
    <meta name="description" content="תכנן את הטיול המשפחתי הבא שלך — לוח זמנים, תקציב, טיסות ולינה" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA: install via Safari → Share → Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="מסע משפחתי" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--
      The two faces the first screen actually paints with. Everything else in
      FONT_FACE_CSS below is fetched on demand via unicode-range, so preloading
      just these keeps the boot shell from ever rendering in a fallback face.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Heebo-400-hebrew.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/FrankRuhlLibre-500-hebrew.woff2" crossorigin />

    <title>מסע משפחתי ✈️</title>

    <!--
      The shell's heading is Home's, which is right for a PWA launch (manifest
      start_url is "/") but wrong for a refreshed deep link into a trip. Blank
      the words in that case and leave the skeleton — the layout still lands in
      the same place, it just stops claiming to be a screen it isn't. Inline
      and parser-blocking on purpose: it must settle before the first paint.
    -->
    <script>
      if (location.pathname !== '/') document.documentElement.setAttribute('data-deep', '')
    </script>

    <!--
      Everything below is inlined on purpose. It is the entire first frame:
      fonts, palette, and the boot shell markup at the bottom of <body>. It has
      to paint from the service-worker precache with zero further requests,
      because the app bundle behind it is ~1MB and takes seconds on cellular.
      Self-hosted fonts replaced a render-blocking fonts.googleapis.com <link>
      that cost two DNS+TLS round trips before a single glyph could be drawn.
    -->
    <style>
      @font-face {
        font-family: 'Frank Ruhl Libre';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/fonts/FrankRuhlLibre-400-hebrew.woff2) format('woff2');
        unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }
      @font-face {
        font-family: 'Frank Ruhl Libre';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/fonts/FrankRuhlLibre-400-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Frank Ruhl Libre';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(/fonts/FrankRuhlLibre-500-hebrew.woff2) format('woff2');
        unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }
      @font-face {
        font-family: 'Frank Ruhl Libre';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(/fonts/FrankRuhlLibre-500-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Frank Ruhl Libre';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(/fonts/FrankRuhlLibre-700-hebrew.woff2) format('woff2');
        unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }
      @font-face {
        font-family: 'Frank Ruhl Libre';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(/fonts/FrankRuhlLibre-700-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Heebo';
        font-style: normal;

        font-display: swap;
        src: url(/fonts/Heebo-400-hebrew.woff2) format('woff2');
        unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }

        src: url(/fonts/Heebo-400-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Heebo';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(/fonts/Heebo-500-hebrew.woff2) format('woff2');
        unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }
      @font-face {
        font-family: 'Heebo';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(/fonts/Heebo-500-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Heebo';
        font-style: normal;

        font-display: swap;
        src: url(/fonts/Heebo-600-hebrew.woff2) format('woff2');
        unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }
      @font-face {
        font-family: 'Heebo';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url(/fonts/Heebo-600-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Heebo';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(/fonts/Heebo-700-hebrew.woff2) format('woff2');
        unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }
      @font-face {
        font-family: 'Heebo';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(/fonts/Heebo-700-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      html {
        background-color: #FBF3DF;
      }

      /*
       * The boot shell. Covers the viewport until React commits its first
       * frame, then main.tsx fades it out. Values here are duplicated from
       * src/theme/warmTheme.ts on purpose — this must paint before any JS
       * runs, so it cannot import them. Keep in sync with warmTheme.colors
       * (gray[50]/[500]/[900], white) and warmDisplayFont.
       */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background-color: #FBF3DF;
        font-family: 'Heebo', 'Segoe UI', Arial, sans-serif;
        color: #2A2013;
        overflow: hidden;
        padding: 0 12px;
        transition: opacity 220ms ease-out;
      }

      #boot[data-done] {
        opacity: 0;
        pointer-events: none;
      }

      .boot-inner {
        max-width: 1280px;
        margin: 0 auto;
      }

      .boot-head {
        padding: 16px 0 12px;
      }

      .boot-title {
        font-family: 'Frank Ruhl Libre', 'Heebo', serif;
        font-weight: 500;
        font-size: 26px;
        line-height: 1.3;
        margin: 0;
      }

      .boot-sub {
        font-size: 14px;
        line-height: 1.5;
        color: #8F7B5C;
        margin: 4px 0 0;
      }

      html[data-deep] .boot-title,
      html[data-deep] .boot-sub {
        visibility: hidden;
      }

      .boot-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .boot-pill {
        height: 44px;
        border-radius: 10px;
        flex: 1 1 calc(50% - 4px);
      }

      .boot-cards {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        margin-top: 16px;
      }

      .boot-card {
        height: 132px;
        border-radius: 16px;
        background-color: #FFFDF7;
        box-shadow: 0 1px 3px rgba(120, 90, 40, 0.10);
      }

      /*
       * Shimmer, not a spinner. A spinner says "wait"; a shimmering layout in
       * the app's own colours reads as the app already being here.
       */
      .boot-pill,
      .boot-card {
        background-image: linear-gradient(
          -90deg,
          rgba(234, 220, 181, 0) 0%,
          rgba(234, 220, 181, 0.55) 50%,
          rgba(234, 220, 181, 0) 100%
        );
        background-size: 200% 100%;
        background-repeat: no-repeat;
        animation: boot-shimmer 1.4s ease-in-out infinite;
      }

      .boot-pill {
        background-color: #F5E9CC;
      }

      .boot-card:nth-child(2) { animation-delay: 0.12s; }
      .boot-card:nth-child(3) { animation-delay: 0.24s; }

      @keyframes boot-shimmer {
        from { background-position: 100% 0; }
        to   { background-position: -100% 0; }
      }

      @media (min-width: 768px) {
        #boot { padding: 0 24px; }
        .boot-head { padding: 32px 0 24px; }
        .boot-title { font-size: 34px; }
        .boot-pill { flex: 0 0 132px; }
        .boot-cards { grid-template-columns: repeat(2, 1fr); }
      }

      @media (min-width: 1024px) {
        .boot-cards { grid-template-columns: repeat(3, 1fr); }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot { transition: none; }
        .boot-pill,
        .boot-card { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Static twin of the Home header (manifest start_url is "/", so this is
      always the screen being waited for). The heading and subtitle are the
      real strings rather than grey bars: they are the same on every launch,
      so showing them is honest and makes the shell read as the app rather
      than as a loading screen.
    -->
    <div id="boot" role="status" aria-label="טוען את מסע משפחתי">
      <div class="boot-inner">
        <div class="boot-head">
          <h1 class="boot-title">✈️ הטיולים שלנו</h1>
          <p class="boot-sub">תכנן את הטיול המשפחתי הבא שלך</p>
          <div class="boot-row">
            <div class="boot-pill"></div>
            <div class="boot-pill"></div>
            <div class="boot-pill"></div>
            <div class="boot-pill"></div>
          </div>
        </div>
        <div class="boot-cards">
          <div class="boot-card"></div>
          <div class="boot-card"></div>
          <div class="boot-card"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
