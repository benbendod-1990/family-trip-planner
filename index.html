<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF3DF" />
    <!--
      Paint the warm background before the stylesheet even arrives, so a cold
      PWA launch never flashes a colour the app doesn't actually use.
      Keep in sync with body{} in src/index.css and manifest background_color.
    -->
    <style>html{background-color:#FBF3DF}</style>
    <meta name="description" content="תכנן את הטיול המשפחתי הבא שלך — לוח זמנים, תקציב, טיסות ולינה" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA: install via Safari → Share → Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="מסע משפחתי" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>מסע משפחתי ✈️</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
